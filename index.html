<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="home.title">Claris Dental Clinic</title>
<meta name="description" data-i18n-attr="content:home.desc" content="Claris Dental Clinic">
<meta name="theme-color" content="#14110D">
<meta property="og:type" content="website">
<meta property="og:title" data-i18n-attr="content:home.title" content="Claris Dental Clinic">
<meta property="og:description" data-i18n-attr="content:home.desc" content="Claris Dental Clinic">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300..700&family=Reem+Kufi:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="index.html">
<a class="skip" href="#main">Skip to content</a>
<div id="siteHeaderMount"></div>
<main id="main">

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="container hero__inner">
    <div class="reveal">
      <p class="hero__tagline" data-i18n="brand.tagline"></p>
      <h1 class="h1" data-i18n="home.hero.title"></h1>
      <p class="lead" data-i18n="home.hero.lead"></p>
      <div class="hero__actions">
        <a href="contact.html" class="btn btn--lg" data-i18n="cta.book"></a>
        <a href="cases.html" class="btn btn--ghost btn--lg" data-i18n="cta.viewCases"></a>
      </div>
      <div class="hero__trust">
        <div><b data-count data-i18n="home.stat1n"></b><span data-i18n="home.stat1"></span></div>
        <div><b data-count data-i18n="home.stat2n"></b><span data-i18n="home.stat2"></span></div>
        <div><b data-i18n="home.stat3n"></b><span data-i18n="home.stat3"></span></div>
      </div>
    </div>
    <div class="hero__media reveal" data-d="2">
      <img src="assets/img/clinic/hero.jpg" alt="The waiting area at Claris Dental Clinic" width="1200" height="1500" style="border-radius:var(--r-xl);aspect-ratio:4/5;object-fit:cover;box-shadow:var(--shadow-lg);width:100%;height:auto">
      <div class="hero__badge">
        <div>
          <div class="stars">★★★★★</div>
          <b data-i18n="home.hero.badgeTitle"></b>
          <span data-i18n="home.hero.badgeSub"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ================= SERVICES ================= -->
<section class="section section--alt">
  <div class="container">
    <div class="shead shead--split reveal">
      <div>
        <p class="eyebrow" data-i18n="home.svc.eyebrow"></p>
        <h2 class="h2" data-i18n="home.svc.title"></h2>
        <p class="lead" style="margin-top:18px" data-i18n="home.svc.lead"></p>
      </div>
      <a href="services.html" class="link-arrow"><span data-i18n="cta.allServices"></span><span data-icon="arrow"></span></a>
    </div>
    <div class="grid g-4">
      <a href="services.html#cosmetic" class="card reveal" data-d="1">
        <div class="card__icon" data-icon="tooth"></div>
        <h3 data-i18n="svc.cos.name"></h3>
        <p data-i18n="svc.cos.desc"></p>
        <ul class="card__list">
          <li data-i18n="svc.cos.l1"></li><li data-i18n="svc.cos.l3"></li><li data-i18n="svc.cos.l4"></li>
        </ul>
        <span class="link-arrow"><span data-i18n="common.learnMore"></span><span data-icon="arrow"></span></span>
      </a>
      <a href="services.html#implants" class="card reveal" data-d="2">
        <div class="card__icon" data-icon="implant"></div>
        <h3 data-i18n="svc.imp.name"></h3>
        <p data-i18n="svc.imp.desc"></p>
        <ul class="card__list">
          <li data-i18n="svc.imp.l1"></li><li data-i18n="svc.imp.l3"></li><li data-i18n="svc.imp.l4"></li>
        </ul>
        <span class="link-arrow"><span data-i18n="common.learnMore"></span><span data-icon="arrow"></span></span>
      </a>
      <a href="services.html#ortho" class="card reveal" data-d="3">
        <div class="card__icon" data-icon="align"></div>
        <h3 data-i18n="svc.ort.name"></h3>
        <p data-i18n="svc.ort.desc"></p>
        <ul class="card__list">
          <li data-i18n="svc.ort.l1"></li><li data-i18n="svc.ort.l2"></li><li data-i18n="svc.ort.l4"></li>
        </ul>
        <span class="link-arrow"><span data-i18n="common.learnMore"></span><span data-icon="arrow"></span></span>
      </a>
      <a href="services.html#general" class="card reveal" data-d="4">
        <div class="card__icon" data-icon="shield"></div>
        <h3 data-i18n="svc.gen.name"></h3>
        <p data-i18n="svc.gen.desc"></p>
        <ul class="card__list">
          <li data-i18n="svc.gen.l1"></li><li data-i18n="svc.gen.l2"></li><li data-i18n="svc.gen.l4"></li>
        </ul>
        <span class="link-arrow"><span data-i18n="common.learnMore"></span><span data-icon="arrow"></span></span>
      </a>
    </div>
  </div>
</section>

<!-- ================= WHY ================= -->
<section class="section">
  <div class="container split">
    <div class="reveal">
      <img src="assets/img/clinic/room.jpg" alt="A treatment room at Claris Dental Clinic" loading="lazy" width="1600" height="1200" style="border-radius:var(--r-xl);aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:var(--shadow);height:auto">
    </div>
    <div class="reveal" data-d="2">
      <p class="eyebrow" data-i18n="home.why.eyebrow"></p>
      <h2 class="h2" data-i18n="home.why.title"></h2>
      <p class="lead" style="margin-top:18px" data-i18n="home.why.lead"></p>
      <div class="ticks">
        <div class="tick"><span data-icon="check"></span><span><b data-i18n="home.why.p1"></b><br><span class="muted" data-i18n="home.why.p1d"></span></span></div>
        <div class="tick"><span data-icon="check"></span><span><b data-i18n="home.why.p2"></b><br><span class="muted" data-i18n="home.why.p2d"></span></span></div>
        <div class="tick"><span data-icon="check"></span><span><b data-i18n="home.why.p3"></b><br><span class="muted" data-i18n="home.why.p3d"></span></span></div>
        <div class="tick"><span data-icon="check"></span><span><b data-i18n="home.why.p4"></b><br><span class="muted" data-i18n="home.why.p4d"></span></span></div>
      </div>
    </div>
  </div>
</section>

<!-- ================= BEFORE / AFTER ================= -->
<section class="section section--alt">
  <div class="container">
    <div class="shead shead--center reveal">
      <p class="eyebrow" data-i18n="home.ba.eyebrow"></p>
      <h2 class="h2" data-i18n="home.ba.title"></h2>
      <p class="lead" data-i18n="home.ba.lead"></p>
    </div>
    <div class="reveal" data-d="2" style="max-width:860px;margin-inline:auto">
      <div class="ba">
        <img class="ba__img" src="assets/img/cases/case-01-before.jpg" alt="">
        <img class="ba__img ba__after" src="assets/img/cases/case-01-after.jpg" alt="">
        <span class="ba__tag ba__tag--b" data-i18n="common.before"></span>
        <span class="ba__tag ba__tag--a" data-i18n="common.after"></span>
        <span class="ba__handle"></span>
        <span class="ba__knob" data-icon="drag"></span>
      </div>
      <p class="muted center" style="margin-top:16px;font-size:14px"><span data-i18n="home.ba.case"></span> · <span data-i18n="common.drag"></span></p>
      <div class="center" style="margin-top:26px"><a href="cases.html" class="btn btn--ghost" data-i18n="cta.viewCases"></a></div>
    </div>
  </div>
</section>

<!-- ================= STEPS ================= -->
<section class="section">
  <div class="container split" style="align-items:start">
    <div class="reveal">
      <p class="eyebrow" data-i18n="home.steps.eyebrow"></p>
      <h2 class="h2" data-i18n="home.steps.title"></h2>
      <img src="assets/img/clinic/tech.jpg" alt="Treatment room and equipment at Claris Dental Clinic" loading="lazy" width="1600" height="1200" style="border-radius:var(--r-xl);aspect-ratio:4/3;object-fit:cover;width:100%;margin-top:34px;box-shadow:var(--shadow-sm);height:auto">
    </div>
    <div class="steps reveal" data-d="2">
      <div class="step"><div class="step__n"></div><div><h3 data-i18n="home.steps.s1"></h3><p data-i18n="home.steps.s1d"></p></div></div>
      <div class="step"><div class="step__n"></div><div><h3 data-i18n="home.steps.s2"></h3><p data-i18n="home.steps.s2d"></p></div></div>
      <div class="step"><div class="step__n"></div><div><h3 data-i18n="home.steps.s3"></h3><p data-i18n="home.steps.s3d"></p></div></div>
      <div class="step"><div class="step__n"></div><div><h3 data-i18n="home.steps.s4"></h3><p data-i18n="home.steps.s4d"></p></div></div>
    </div>
  </div>
</section>

<!-- ================= TESTIMONIALS ================= -->
<section class="section section--alt">
  <div class="container">
    <div class="shead shead--center reveal">
      <p class="eyebrow" data-i18n="home.testi.eyebrow"></p>
      <h2 class="h2" data-i18n="home.testi.title"></h2>
      <p class="lead" data-i18n="home.testi.lead"></p>
    </div>
    <div class="grid g-3">
      <blockquote class="quote reveal" data-d="1">
        <div class="stars">★★★★★</div><p data-i18n="home.testi.q1"></p>
        <footer><span class="avatar">A</span><span><cite data-i18n="home.testi.n1"></cite><small data-i18n="home.testi.r1"></small></span></footer>
      </blockquote>
      <blockquote class="quote reveal" data-d="2">
        <div class="stars">★★★★★</div><p data-i18n="home.testi.q2"></p>
        <footer><span class="avatar">M</span><span><cite data-i18n="home.testi.n2"></cite><small data-i18n="home.testi.r2"></small></span></footer>
      </blockquote>
      <blockquote class="quote reveal" data-d="3">
        <div class="stars">★★★★★</div><p data-i18n="home.testi.q3"></p>
        <footer><span class="avatar">S</span><span><cite data-i18n="home.testi.n3"></cite><small data-i18n="home.testi.r3"></small></span></footer>
      </blockquote>
    </div>
  </div>
</section>

<!-- ================= CTA ================= -->
<section class="section section--tight">
  <div class="container">
    <div class="cta reveal">
      <div class="cta__inner">
        <div>
          
          <h2 class="h2" data-i18n="home.cta.title"></h2>
          <p data-i18n="home.cta.lead"></p>
        </div>
        <div class="cta__actions">
          <a href="contact.html" class="btn btn--light btn--lg" data-i18n="cta.book"></a>
          <a href="#" data-href="wa" class="btn btn--outline-light btn--lg" data-i18n="cta.whatsapp"></a>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
<div id="siteFooterMount"></div>
<script src="assets/js/main.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
