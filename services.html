<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="svc.title">Claris Dental Clinic</title>
<meta name="description" data-i18n-attr="content:svc.desc" content="Claris Dental Clinic">
<meta name="theme-color" content="#14110D">
<meta property="og:type" content="website">
<meta property="og:title" data-i18n-attr="content:svc.title" content="Claris Dental Clinic">
<meta property="og:description" data-i18n-attr="content:svc.desc" content="Claris Dental Clinic">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300..700&family=Reem+Kufi:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="services.html">
<a class="skip" href="#main">Skip to content</a>
<div id="siteHeaderMount"></div>
<main id="main">

<section class="phead">
  <div class="container">
    <p class="crumb"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="nav.services"></span></p>
    <p class="eyebrow" data-i18n="svc.eyebrow"></p>
    <h1 class="h1" style="max-width:15ch" data-i18n="svc.h1"></h1>
    <p class="lead" style="margin-top:22px" data-i18n="svc.lead"></p>
  </div>
</section>

<section class="section--tight" id="cosmetic">
  <div class="container split">
    <div class="reveal">
      <div class="card__icon" data-icon="tooth"></div>
      <h2 class="h2" data-i18n="svc.cos.name"></h2>
      <p class="lead" style="margin-top:16px" data-i18n="svc.cos.long"></p>
      <ul class="card__list" style="margin-top:22px">
        <li data-i18n="svc.cos.l1"></li><li data-i18n="svc.cos.l2"></li><li data-i18n="svc.cos.l3"></li><li data-i18n="svc.cos.l4"></li><li data-i18n="svc.cos.l5"></li>
      </ul>
      <div style="margin-top:26px"><a href="contact.html" class="btn" data-i18n="cta.book"></a></div>
    </div>
    <div class="reveal" data-d="2">
      <div class="ba">
        <img class="ba__img" src="assets/img/cases/case-01-before.jpg" alt="">
        <img class="ba__img ba__after" src="assets/img/cases/case-01-after.jpg" alt="">
        <span class="ba__tag ba__tag--b" data-i18n="common.before"></span>
        <span class="ba__tag ba__tag--a" data-i18n="common.after"></span>
        <span class="ba__handle"></span><span class="ba__knob" data-icon="drag"></span>
      </div>
    </div>
  </div>
</section>

<section class="section section--alt" id="implants">
  <div class="container split">
    <div class="reveal" data-d="2" style="order:2">
      <div class="ba">
        <img class="ba__img" src="assets/img/cases/case-03-before.jpg" alt="">
        <img class="ba__img ba__after" src="assets/img/cases/case-03-after.jpg" alt="">
        <span class="ba__tag ba__tag--b" data-i18n="common.before"></span>
        <span class="ba__tag ba__tag--a" data-i18n="common.after"></span>
        <span class="ba__handle"></span><span class="ba__knob" data-icon="drag"></span>
      </div>
    </div>
    <div class="reveal" style="order:1">
      <div class="card__icon" data-icon="implant"></div>
      <h2 class="h2" data-i18n="svc.imp.name"></h2>
      <p class="lead" style="margin-top:16px" data-i18n="svc.imp.long"></p>
      <ul class="card__list" style="margin-top:22px">
        <li data-i18n="svc.imp.l1"></li><li data-i18n="svc.imp.l2"></li><li data-i18n="svc.imp.l3"></li><li data-i18n="svc.imp.l4"></li><li data-i18n="svc.imp.l5"></li>
      </ul>
      <div style="margin-top:26px"><a href="contact.html" class="btn" data-i18n="cta.book"></a></div>
    </div>
  </div>
</section>

<section class="section" id="ortho">
  <div class="container split">
    <div class="reveal">
      <div class="card__icon" data-icon="align"></div>
      <h2 class="h2" data-i18n="svc.ort.name"></h2>
      <p class="lead" style="margin-top:16px" data-i18n="svc.ort.long"></p>
      <ul class="card__list" style="margin-top:22px">
        <li data-i18n="svc.ort.l1"></li><li data-i18n="svc.ort.l2"></li><li data-i18n="svc.ort.l3"></li><li data-i18n="svc.ort.l4"></li><li data-i18n="svc.ort.l5"></li>
      </ul>
      <div style="margin-top:26px"><a href="contact.html" class="btn" data-i18n="cta.book"></a></div>
    </div>
    <div class="reveal" data-d="2">
      <div class="ba">
        <img class="ba__img" src="assets/img/cases/case-04-before.jpg" alt="">
        <img class="ba__img ba__after" src="assets/img/cases/case-04-after.jpg" alt="">
        <span class="ba__tag ba__tag--b" data-i18n="common.before"></span>
        <span class="ba__tag ba__tag--a" data-i18n="common.after"></span>
        <span class="ba__handle"></span><span class="ba__knob" data-icon="drag"></span>
      </div>
    </div>
  </div>
</section>

<section class="section section--alt" id="general">
  <div class="container split">
    <div class="reveal" data-d="2" style="order:2">
      <div class="ba">
        <img class="ba__img" src="assets/img/cases/case-06-before.jpg" alt="">
        <img class="ba__img ba__after" src="assets/img/cases/case-06-after.jpg" alt="">
        <span class="ba__tag ba__tag--b" data-i18n="common.before"></span>
        <span class="ba__tag ba__tag--a" data-i18n="common.after"></span>
        <span class="ba__handle"></span><span class="ba__knob" data-icon="drag"></span>
      </div>
    </div>
    <div class="reveal" style="order:1">
      <div class="card__icon" data-icon="shield"></div>
      <h2 class="h2" data-i18n="svc.gen.name"></h2>
      <p class="lead" style="margin-top:16px" data-i18n="svc.gen.long"></p>
      <ul class="card__list" style="margin-top:22px">
        <li data-i18n="svc.gen.l1"></li><li data-i18n="svc.gen.l2"></li><li data-i18n="svc.gen.l3"></li><li data-i18n="svc.gen.l4"></li><li data-i18n="svc.gen.l5"></li><li data-i18n="svc.gen.l6"></li>
      </ul>
      <div style="margin-top:26px"><a href="contact.html" class="btn" data-i18n="cta.book"></a></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:860px">
    <div class="shead shead--center reveal"><h2 class="h2" data-i18n="svc.faq.title"></h2></div>
    <div class="faq reveal" data-d="2">
      <details open><summary data-i18n="svc.faq.q1"></summary><div class="faq__a" data-i18n="svc.faq.a1"></div></details>
      <details><summary data-i18n="svc.faq.q2"></summary><div class="faq__a" data-i18n="svc.faq.a2"></div></details>
      <details><summary data-i18n="svc.faq.q3"></summary><div class="faq__a" data-i18n="svc.faq.a3"></div></details>
      <details><summary data-i18n="svc.faq.q4"></summary><div class="faq__a" data-i18n="svc.faq.a4"></div></details>
      <details><summary data-i18n="svc.faq.q5"></summary><div class="faq__a" data-i18n="svc.faq.a5"></div></details>
    </div>
  </div>
</section>

<section class="section section--tight">
  <div class="container">
    <div class="cta reveal"><div class="cta__inner">
      <div><h2 class="h2" data-i18n="home.cta.title"></h2><p data-i18n="home.cta.lead"></p></div>
      <div class="cta__actions">
        <a href="contact.html" class="btn btn--light btn--lg" data-i18n="cta.book"></a>
        <a href="#" data-href="wa" class="btn btn--outline-light btn--lg" data-i18n="cta.whatsapp"></a>
      </div>
    </div></div>
  </div>
</section>
</main>
<div id="siteFooterMount"></div>
<script src="assets/js/main.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
