<!DOCTYPE html>

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<body data-page="cases.html">
<a class="skip" href="#main">Skip to content</a>
<div id="siteHeaderMount"></div>
<main id="main">

<section class="phead">
  <div class="container">
    <p class="crumb"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="nav.cases"></span></p>
    <p class="eyebrow" data-i18n="cases.eyebrow"></p>
    <h1 class="h1" style="max-width:14ch" data-i18n="cases.h1"></h1>
    <p class="lead" style="margin-top:22px" data-i18n="cases.lead"></p>
  </div>
</section>

<section class="section--tight">
  <div class="container">
    <div class="filters reveal">
      <button class="is-on" data-filter="all" data-i18n="cases.f.all"></button>
      <button data-filter="cos" data-i18n="cases.f.cos"></button>
      <button data-filter="imp" data-i18n="cases.f.imp"></button>
      <button data-filter="ort" data-i18n="cases.f.ort"></button>
      <button data-filter="gen" data-i18n="cases.f.gen"></button>
    </div>

    <div class="grid g-2">
      <article class="case reveal" data-cat="cos" data-d="1">
        <div class="ba" style="border-radius:0">
          <img class="ba__img" src="assets/img/cases/case-01-before.jpg" alt=""><img class="ba__img ba__after" src="assets/img/cases/case-01-after.jpg" alt="">
          <span class="ba__tag ba__tag--b" data-i18n="common.before"></span><span class="ba__tag ba__tag--a" data-i18n="common.after"></span>
          <span class="ba__handle"></span><span class="ba__knob" data-icon="drag"></span>
        </div>
        <div class="case__body"><div class="case__meta"><span class="chip" data-i18n="cases.f.cos"></span></div>
          <h3 data-i18n="cases.c1"></h3><p data-i18n="cases.c1d"></p></div>
      </article>

      <article class="case reveal" data-cat="cos" data-d="2">

        </div>
        <div class="case__body"><div class="case__meta"><span class="chip" data-i18n="cases.f.cos"></span></div>
          <h3 data-i18n="cases.c2"></h3><p data-i18n="cases.c2d"></p></div>
      </article>

      <article class="case reveal" data-cat="imp" data-d="1">

          <h3 data-i18n="cases.c6"></h3><p data-i18n="cases.c6d"></p></div>

    <p class="muted center reveal" style="margin-top:34px;font-size:14px" data-i18n="cases.note"></p>

  <div class="container">
    <div class="cta reveal"><div class="cta__inner">
      <div><h2 class="h2" data-i18n="home.cta.title"></h2><p data-i18n="home.cta.lead"></p></div>
      <div class="cta__actions">
        <a href="contact.html" class="btn btn--light btn--lg" data-i18n="cta.book"></a>
        <a href="#" data-href="wa" class="btn btn--outline-light btn--lg" data-i18n="cta.whatsapp"></a>
      </div>
    </div></div>
  </div>

</main>
<div id="siteFooterMount"></div>
