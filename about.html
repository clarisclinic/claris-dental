<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="about.title">Claris Dental Clinic</title>
<meta name="description" data-i18n-attr="content:about.desc" content="Claris Dental Clinic">
<meta name="theme-color" content="#14110D">
<meta property="og:type" content="website">
<meta property="og:title" data-i18n-attr="content:about.title" content="Claris Dental Clinic">
<meta property="og:description" data-i18n-attr="content:about.desc" content="Claris Dental Clinic">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300..700&family=Reem+Kufi:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="about.html">
<a class="skip" href="#main">Skip to content</a>
<div id="siteHeaderMount"></div>
<main id="main">

<section class="phead">
  <div class="container">
    <p class="crumb"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="nav.about"></span></p>
    <p class="eyebrow" data-i18n="about.eyebrow"></p>
    <h1 class="h1" style="max-width:16ch" data-i18n="about.h1"></h1>
    <p class="lead" style="margin-top:22px" data-i18n="about.lead"></p>
  </div>
</section>

<section class="section--tight">
  <div class="container grid g-2">
    <img class="reveal" src="assets/img/clinic/reception.jpg" alt="The Claris reception and waiting area" loading="lazy" width="1600" height="1200" style="border-radius:var(--r-xl);aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:var(--shadow);height:auto">
    <img class="reveal" data-d="2" src="assets/img/clinic/waiting.jpg" alt="The waiting area at Claris Dental Clinic" loading="lazy" width="1600" height="1200" style="border-radius:var(--r-xl);aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:var(--shadow);height:auto">
    <img class="reveal" src="assets/img/clinic/room.jpg" alt="A treatment room at Claris Dental Clinic" loading="lazy" width="1600" height="1200" style="border-radius:var(--r-xl);aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:var(--shadow);height:auto">
    <img class="reveal" data-d="2" src="assets/img/clinic/room-2.jpg" alt="A second treatment room at Claris Dental Clinic" loading="lazy" width="1600" height="1200" style="border-radius:var(--r-xl);aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:var(--shadow);height:auto">
  </div>
</section>

<section class="section">
  <div class="container split">
    <div class="reveal">
      <h2 class="h2" data-i18n="about.story.title"></h2>
    </div>
    <div class="reveal" data-d="2" style="display:grid;gap:20px">
      <p class="lead" data-i18n="about.story.p1"></p>
      <p class="lead" data-i18n="about.story.p2"></p>
      <p class="lead" data-i18n="about.story.p3"></p>
      <div><a href="services.html" class="link-arrow"><span data-i18n="cta.allServices"></span><span data-icon="arrow"></span></a></div>
    </div>
  </div>
</section>

<section class="section section--alt">
  <div class="container">
    <div class="shead reveal">
      <p class="eyebrow" data-i18n="about.values.eyebrow"></p>
      <h2 class="h2" data-i18n="about.values.title"></h2>
    </div>
    <div class="grid g-4">
      <div class="card reveal" data-d="1"><div class="card__icon" data-icon="shield"></div><h3 data-i18n="about.v1"></h3><p data-i18n="about.v1d"></p></div>
      <div class="card reveal" data-d="2"><div class="card__icon" data-icon="scan"></div><h3 data-i18n="about.v2"></h3><p data-i18n="about.v2d"></p></div>
      <div class="card reveal" data-d="3"><div class="card__icon" data-icon="money"></div><h3 data-i18n="about.v3"></h3><p data-i18n="about.v3d"></p></div>
      <div class="card reveal" data-d="4"><div class="card__icon" data-icon="heart"></div><h3 data-i18n="about.v4"></h3><p data-i18n="about.v4d"></p></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="shead reveal">
      <p class="eyebrow" data-i18n="about.tech.eyebrow"></p>
      <h2 class="h2" data-i18n="about.tech.title"></h2>
      <p class="lead" style="margin-top:18px" data-i18n="about.tech.lead"></p>
    </div>
    <div class="grid g-3">
      <div class="card reveal" data-d="1"><div class="card__icon" data-icon="scan"></div><h3 data-i18n="about.t1"></h3><p data-i18n="about.t1d"></p></div>
      <div class="card reveal" data-d="2"><div class="card__icon" data-icon="xray"></div><h3 data-i18n="about.t2"></h3><p data-i18n="about.t2d"></p></div>
      <div class="card reveal" data-d="3"><div class="card__icon" data-icon="tooth"></div><h3 data-i18n="about.t3"></h3><p data-i18n="about.t3d"></p></div>
      <div class="card reveal" data-d="4"><div class="card__icon" data-icon="micro"></div><h3 data-i18n="about.t4"></h3><p data-i18n="about.t4d"></p></div>
      <div class="card reveal" data-d="5"><div class="card__icon" data-icon="guide"></div><h3 data-i18n="about.t5"></h3><p data-i18n="about.t5d"></p></div>
      <div class="card reveal" data-d="6"><div class="card__icon" data-icon="implant"></div><h3 data-i18n="about.t6"></h3><p data-i18n="about.t6d"></p></div>
    </div>
  </div>
</section>

<section class="section section--tight">
  <div class="container">
    <div class="cta reveal">
      <div class="cta__inner">
        <div><h2 class="h2" data-i18n="home.cta.title"></h2><p data-i18n="home.cta.lead"></p></div>
        <div class="cta__actions">
          <a href="contact.html" class="btn btn--light btn--lg" data-i18n="cta.book"></a>
          <a href="#" data-href="wa" class="btn btn--outline-light btn--lg" data-i18n="cta.whatsapp"></a>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
<div id="siteFooterMount"></div>
<script src="assets/js/main.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
