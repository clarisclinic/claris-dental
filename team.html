<body data-page="team.html">

    <p class="lead" style="margin-top:22px" data-i18n="team.lead"></p>
  </div>
</section>

<section class="section--tight">
  <div class="container">
    <div class="grid g-3">
      <div class="member reveal" data-d="1"><div class="member__photo"><img src="assets/img/team/member-1.jpg" alt=""></div>
        <h3>Dr. Name Surname</h3><p class="role" data-i18n="team.role1"></p><p class="bio" data-i18n="team.bio"></p></div>
      <div class="member reveal" data-d="2"><div class="member__photo"><img src="assets/img/team/member-2.jpg" alt=""></div>
        <h3>Dr. Name Surname</h3><p class="role" data-i18n="team.role2"></p><p class="bio" data-i18n="team.bio"></p></div>
      <div class="member reveal" data-d="3"><div class="member__photo"><img src="assets/img/team/member-3.jpg" alt=""></div>
        <h3>Dr. Name Surname</h3><p class="role" data-i18n="team.role3"></p><p class="bio" data-i18n="team.bio"></p></div>
      <div class="member reveal" data-d="1"><div class="member__photo"><img src="assets/img/team/member-4.jpg" alt=""></div>
        <h3>Dr. Name Surname</h3><p class="role" data-i18n="team.role4"></p><p class="bio" data-i18n="team.bio"></p></div>
      <div class="member reveal" data-d="2"><div class="member__photo"><img src="assets/img/team/member-5.jpg" alt=""></div>
        <h3>Name Surname</h3><p class="role" data-i18n="team.role5"></p><p class="bio" data-i18n="team.bio"></p></div>
      <div class="member reveal" data-d="3"><div class="member__photo"><img src="assets/img/team/member-6.jpg" alt=""></div>
        <h3>Name Surname</h3><p class="role" data-i18n="team.role6"></p><p class="bio" data-i18n="team.bio"></p></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container split">
    <div class="reveal"><img src="assets/img/clinic/lounge.jpg" alt="The lounge at Claris Dental Clinic" style="border-radius:var(--r-xl);aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:var(--shadow);height:auto"></div>
    <div class="reveal" data-d="2">
      <h2 class="h2" data-i18n="team.join.title"></h2>
      <p class="lead" style="margin-top:18px" data-i18n="team.join.lead"></p>
      <div style="margin-top:26px"><a href="contact.html" class="btn" data-i18n="team.join.btn"></a></div>
    </div>
  </div>
</section>
